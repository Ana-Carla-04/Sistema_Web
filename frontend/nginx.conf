server {
    listen 80;
    server_name localhost;

    # Oculta a versao do Nginx nas respostas e paginas de erro (OWASP A02)
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cabecalhos HTTP de seguranca (OWASP A02)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Proxy reverso para o container "app" (Spring Boot) na rede do Docker Compose.
    location /SIPA/ {
        proxy_pass http://app:8080/SIPA/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte ao roteamento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
