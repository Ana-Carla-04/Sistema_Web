server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para o container "app" (Spring Boot) na rede do Docker Compose.
    # Elimina a necessidade de configurar CORS na API quando rodando via Docker.
    location /SIPA/ {
        proxy_pass http://app:8080/SIPA/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte ao roteamento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
