spring.application.name=SIPA

spring.config.import=optional:file:.env[.properties]
# ==============================================
# SERVIDOR E TRATAMENTO DE ERROS (OWASP A02 / A10)
# ==============================================
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ==============================================
# BANCO DE DADOS (PostgreSQL)
# ==============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sipa}
spring.datasource.username=${DB_USER:sipa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================
# JPA / HIBERNATE
# ==============================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# SEGURANÇA / JWT / CORS
# ==============================================
api.security.token.secret=${JWT_SECRET}
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3001,http://127.0.0.1:5173,http://127.0.0.1:3001}
