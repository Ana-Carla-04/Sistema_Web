spring.application.name=SIPA

# Porta HTTP da aplicacao; pode ser alterada sem reconstruir a imagem.
server.port=${SERVER_PORT:8080}

# Configuracao do PostgreSQL por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sipa}
spring.datasource.username=${DB_USER:sipa}
spring.datasource.password=${DB_PASSWORD:sipa}
spring.datasource.driver-class-name=org.postgresql.Driver

# Atualiza o schema automaticamente durante o desenvolvimento.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Segredo obrigatorio para assinar tokens JWT; nunca coloque o valor real no repositorio.
api.security.token.secret=${JWT_SECRET}
