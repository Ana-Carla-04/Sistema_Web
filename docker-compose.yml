services:
  db:
    image: postgres:16-alpine
    pull_policy: missing
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sipa}
      POSTGRES_USER: ${POSTGRES_USER:-sipa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      pull: false
    pull_policy: build
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sipa}
      DB_USER: ${POSTGRES_USER:-sipa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      SERVER_PORT: 8080
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Verifica via socket TCP nativo do bash se o Tomcat ja esta aceitando conexoes na 8080
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    develop:
      watch:
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./pom.xml

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      pull: false
    pull_policy: build
    ports:
      - "3001:80"
    depends_on:
      app:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:
